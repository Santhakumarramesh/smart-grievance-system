<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Smart Grievance System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="department-backgrounds.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Admin Dashboard</h1>
            <div class="header-actions">
                <div class="user-info"></div>
                <button id="logoutBtn" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Analytics -->
        <div class="card">
            <h2 class="card-title">System Analytics</h2>
            <div id="analytics">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Create Officer -->
        <div class="card">
            <h2 class="card-title">Create New Officer</h2>
            
            <form id="createOfficerForm">
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem;">
                    <div class="form-group">
                        <label class="form-label" for="name">Full Name</label>
                        <input type="text" id="name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="phone">Phone</label>
                        <input type="tel" id="phone" class="form-input" pattern="[0-9]{10}" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="department">Department</label>
                        <select id="department" class="form-select" required>
                            <option value="">Select Department</option>
                            <optgroup label="Municipal & Utilities">
                                <option value="Water Supply">Water Supply</option>
                                <option value="Electricity">Electricity</option>
                                <option value="Sanitation & Solid Waste">Sanitation & Solid Waste</option>
                                <option value="Sewerage & Drainage">Sewerage & Drainage</option>
                                <option value="Roads & Potholes">Roads & Potholes</option>
                                <option value="Streetlights">Streetlights</option>
                            </optgroup>
                            <optgroup label="Police & Public Safety">
                                <option value="Police">Police</option>
                                <option value="Traffic">Traffic</option>
                                <option value="Cyber Crime">Cyber Crime</option>
                            </optgroup>
                            <optgroup label="Health & Social Welfare">
                                <option value="Public Health">Public Health</option>
                                <option value="Food Safety">Food Safety</option>
                            </optgroup>
                            <optgroup label="Education">
                                <option value="Education">Education</option>
                            </optgroup>
                            <optgroup label="Revenue & Documents">
                                <option value="Land & Revenue">Land & Revenue</option>
                                <option value="Ration Card / PDS">Ration Card / PDS</option>
                            </optgroup>
                            <optgroup label="Transport">
                                <option value="RTO / Transport">RTO / Transport</option>
                            </optgroup>
                            <optgroup label="Consumer Services">
                                <option value="Telecom / Network">Telecom / Network</option>
                            </optgroup>
                            <optgroup label="Environment">
                                <option value="Environment">Environment</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-input" minlength="6" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Create Officer</button>
            </form>
        </div>

        <!-- User Information -->
        <div class="card">
            <h2 class="card-title">👥 All Users (Citizens)</h2>
            <div id="usersList">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Officers List -->
        <div class="card">
            <h2 class="card-title">👮 All Officers</h2>
            <div id="officersList">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- All Grievances -->
        <div class="card">
            <h2 class="card-title">All Grievances</h2>
            
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <select id="filterStatus" class="form-select" style="max-width: 200px;">
                    <option value="">All Statuses</option>
                    <option value="Received">Received</option>
                    <option value="Assigned to Department">Assigned to Department</option>
                    <option value="Under Progress">Under Progress</option>
                    <option value="Investigation">Investigation</option>
                    <option value="Reviewed">Reviewed</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Closed">Closed</option>
                </select>

                <select id="filterDepartment" class="form-select" style="max-width: 200px;">
                    <option value="">All Departments</option>
                </select>

                <button id="applyFiltersBtn" class="btn btn-primary">Apply Filters</button>
            </div>

            <div id="grievancesList">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if (!checkAuth()) {
            throw new Error('Not authenticated');
        }

        const user = getUser();
        if (user.role !== 'ADMIN') {
            showAlert('Access denied. Admins only.', 'error');
            setTimeout(() => window.location.href = '/index.html', 2000);
        }

        // Load analytics
        async function loadAnalytics() {
            try {
                const data = await apiCall('/admin/analytics');
                
                const analyticsHtml = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-label">Total Grievances</div>
                            <div class="stat-value">${data.total_grievances}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Citizens</div>
                            <div class="stat-value">${data.total_users}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Total Officers</div>
                            <div class="stat-value">${data.total_officers}</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-label">Avg Resolution Time</div>
                            <div class="stat-value">${data.avg_resolution_time_days} days</div>
                        </div>
                    </div>

                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 2rem; margin-top: 2rem;">
                        <div>
                            <h3 style="margin-bottom: 1rem;">By Status</h3>
                            ${Object.entries(data.counts_by_status).map(([status, count]) => `
                                <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color);">
                                    <span>${status}</span>
                                    <span class="badge ${getStatusBadgeClass(status)}">${count}</span>
                                </div>
                            `).join('')}
                        </div>

                        <div>
                            <h3 style="margin-bottom: 1rem;">By Department</h3>
                            ${Object.entries(data.counts_by_department).map(([dept, count]) => `
                                <div style="display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color);">
                                    <span>${dept}</span>
                                    <span class="badge badge-progress">${count}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;

                document.getElementById('analytics').innerHTML = analyticsHtml;
            } catch (error) {
                document.getElementById('analytics').innerHTML = 
                    `<p class="alert alert-error">${error.message}</p>`;
            }
        }

        // Load users (citizens)
        async function loadUsers() {
            try {
                const data = await apiCall('/admin/users');
                const usersList = document.getElementById('usersList');

                if (data.users.length === 0) {
                    usersList.innerHTML = '<p style="color: var(--text-secondary);">No users registered yet.</p>';
                    return;
                }

                usersList.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>City/State</th>
                                    <th>Grievances</th>
                                    <th>Email Status</th>
                                    <th>Registered</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.users.map(u => `
                                    <tr>
                                        <td>${u.name}</td>
                                        <td>${u.email}</td>
                                        <td>${u.phone}</td>
                                        <td>${u.city || '-'}, ${u.state || '-'}</td>
                                        <td><span class="badge badge-progress">${u.grievance_count}</span></td>
                                        <td>
                                            ${u.email_verified 
                                                ? '<span class="badge badge-success">✓ Verified</span>' 
                                                : '<span class="badge badge-pending">⏳ Pending</span>'}
                                        </td>
                                        <td>${formatDate(u.created_at)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                document.getElementById('usersList').innerHTML = 
                    `<p class="alert alert-error">${error.message}</p>`;
            }
        }

        // Load officers
        async function loadOfficers() {
            try {
                const data = await apiCall('/admin/officers');
                const officersList = document.getElementById('officersList');

                if (data.officers.length === 0) {
                    officersList.innerHTML = '<p style="color: var(--text-secondary);">No officers created yet.</p>';
                    return;
                }

                // Higher Authority Contact Numbers by State
                const higherAuthority = {
                    'Tamil Nadu': { name: 'Chief Secretary, TN', phone: '044-2567-0001', email: 'cs@tn.gov.in' },
                    'Karnataka': { name: 'Chief Secretary, KA', phone: '080-2225-2001', email: 'cs@karnataka.gov.in' },
                    'Maharashtra': { name: 'Chief Secretary, MH', phone: '022-2202-0001', email: 'cs@maharashtra.gov.in' },
                    'Delhi': { name: 'Chief Secretary, Delhi', phone: '011-2339-0001', email: 'cs@delhi.gov.in' },
                    'Kerala': { name: 'Chief Secretary, Kerala', phone: '0471-2518-001', email: 'cs@kerala.gov.in' },
                    'Gujarat': { name: 'Chief Secretary, Gujarat', phone: '079-2323-0001', email: 'cs@gujarat.gov.in' },
                    'Rajasthan': { name: 'Chief Secretary, Rajasthan', phone: '0141-2227-001', email: 'cs@rajasthan.gov.in' },
                    'West Bengal': { name: 'Chief Secretary, WB', phone: '033-2214-0001', email: 'cs@wb.gov.in' },
                    'Uttar Pradesh': { name: 'Chief Secretary, UP', phone: '0522-2239-001', email: 'cs@up.gov.in' },
                    'Default': { name: 'National Helpline', phone: '1800-111-555', email: 'grievance@india.gov.in' }
                };

                const state = 'Tamil Nadu'; // Can be made dynamic based on user location
                const authority = higherAuthority[state] || higherAuthority['Default'];

                officersList.innerHTML = `
                    <div style="background: linear-gradient(135deg, #FF9933 0%, #FFFFFF 50%, #138808 100%); padding: 15px; border-radius: 10px; margin-bottom: 20px; border-left: 4px solid #FF9933;">
                        <h3 style="margin: 0 0 10px 0; color: #1F2937;">📞 Higher Authority Contact (${state})</h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
                            <div>
                                <strong style="color: #6B7280;">Name:</strong><br>
                                <span style="color: #1F2937;">${authority.name}</span>
                            </div>
                            <div>
                                <strong style="color: #6B7280;">Phone:</strong><br>
                                <a href="tel:${authority.phone}" style="color: #FF9933; text-decoration: none; font-weight: 600;">${authority.phone}</a>
                            </div>
                            <div>
                                <strong style="color: #6B7280;">Email:</strong><br>
                                <a href="mailto:${authority.email}" style="color: #138808; text-decoration: none; font-weight: 600;">${authority.email}</a>
                            </div>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                    <th>Department</th>
                                    <th>Created</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.officers.map(o => `
                                    <tr>
                                        <td>${o.name}</td>
                                        <td>${o.email}</td>
                                        <td>${o.phone}</td>
                                        <td><span class="badge badge-progress">${o.department}</span></td>
                                        <td>${formatDate(o.created_at)}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                document.getElementById('officersList').innerHTML = 
                    `<p class="alert alert-error">${error.message}</p>`;
            }
        }

        // Load departments for filter
        async function loadDepartments() {
            try {
                const data = await apiCall('/admin/departments');
                const select = document.getElementById('filterDepartment');
                
                data.departments.forEach(dept => {
                    const option = document.createElement('option');
                    option.value = dept;
                    option.textContent = dept;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading departments:', error);
            }
        }

        // Load all grievances
        async function loadGrievances() {
            try {
                const status = document.getElementById('filterStatus').value;
                const department = document.getElementById('filterDepartment').value;
                
                let url = '/admin/all-grievances?';
                if (status) url += `status=${encodeURIComponent(status)}&`;
                if (department) url += `department=${encodeURIComponent(department)}`;

                const data = await apiCall(url);
                const grievancesList = document.getElementById('grievancesList');

                if (data.grievances.length === 0) {
                    grievancesList.innerHTML = '<p style="color: var(--text-secondary);">No grievances found.</p>';
                    return;
                }

                grievancesList.innerHTML = `
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Complaint</th>
                                    <th>Department</th>
                                    <th>Assigned Officer</th>
                                    <th>Officer Contact</th>
                                    <th>Status</th>
                                    <th>Submitted</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${data.grievances.map(g => `
                                    <tr>
                                        <td>#${g.id}</td>
                                        <td style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                                            ${g.complaint_text}
                                        </td>
                                        <td><span class="badge badge-progress">${g.assigned_department}</span></td>
                                        <td>
                                            ${g.assigned_officer ? `
                                                <strong>${g.assigned_officer.name}</strong><br>
                                                <small>${g.assigned_officer.designation || 'Officer'}</small><br>
                                                <small style="color: #6B7280;">📍 ${g.assigned_officer.office_building || 'Office'}</small>
                                            ` : '<span style="color: #9CA3AF;">Not Assigned</span>'}
                                        </td>
                                        <td>
                                            ${g.assigned_officer ? `
                                                <small>📞 ${g.assigned_officer.office_number || g.assigned_officer.phone}</small><br>
                                                <small>📧 ${g.assigned_officer.office_email || g.assigned_officer.email}</small><br>
                                                <small style="color: #6B7280;">📍 ${g.assigned_officer.office_location || 'N/A'}</small>
                                            ` : '<span style="color: #9CA3AF;">-</span>'}
                                        </td>
                                        <td><span class="badge ${getStatusBadgeClass(g.status)}">${g.status}</span></td>
                                        <td>${formatDate(g.created_at)}</td>
                                        <td>
                                            <a href="track.html?id=${g.id}" class="btn btn-primary" style="padding: 0.25rem 0.75rem; font-size: 0.875rem;">View</a>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            } catch (error) {
                document.getElementById('grievancesList').innerHTML = 
                    `<p class="alert alert-error">${error.message}</p>`;
            }
        }

        // Create officer
        document.getElementById('createOfficerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                department: document.getElementById('department').value,
                password: document.getElementById('password').value
            };

            try {
                const data = await apiCall('/admin/create-officer', {
                    method: 'POST',
                    body: JSON.stringify(formData)
                });

                showAlert(data.message, 'success');
                document.getElementById('createOfficerForm').reset();
                loadOfficers();

            } catch (error) {
                showAlert(error.message, 'error');
            }
        });

        // Apply filters
        document.getElementById('applyFiltersBtn').addEventListener('click', loadGrievances);

        // Load data on page load
        loadAnalytics();
        loadUsers();
        loadOfficers();
        loadDepartments();
        loadGrievances();

        // Auto-refresh analytics every 60 seconds
        setInterval(loadAnalytics, 60000);
    </script>
    <script src="department-showcase.js"></script>
    <script src="language-selector-widget.js"></script>
</body>
</html>
