<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Smart Grievance System</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="government-portal-theme.css">
    <link rel="stylesheet" href="improved-contrast.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, 
                rgba(255, 153, 51, 0.08) 0%,
                rgba(255, 255, 255, 1) 50%,
                rgba(19, 136, 8, 0.08) 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, 
                #FF9933 0%, #FF9933 33%, 
                #FFFFFF 33%, #FFFFFF 66%, 
                #138808 66%, #138808 100%);
            z-index: 1000;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 153, 51, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(19, 136, 8, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 1px solid rgba(255, 153, 51, 0.1);
        }

        .login-header {
            background: linear-gradient(135deg, #003DA5 0%, #001F52 100%);
            padding: 30px 30px 25px;
            text-align: center;
            position: relative;
        }

        .login-header::before {
            content: '🇮🇳';
            font-size: 2.5rem;
            display: block;
            margin-bottom: 10px;
        }

        .login-header h1 {
            color: white;
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .login-header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin: 0;
        }

        .login-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: #1F2937;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .password-input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #E5E7EB;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
            box-sizing: border-box;
        }

        .form-input:focus {
            outline: none;
            border-color: #003DA5;
            box-shadow: 0 0 0 3px rgba(0, 61, 165, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: #6B7280;
            font-size: 1.2rem;
            padding: 5px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: #003DA5;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #FF9933 0%, #FF7700 50%, #138808 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-login:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 153, 51, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .auth-link {
            text-align: center;
            margin-top: 20px;
            color: #6B7280;
            font-size: 0.9rem;
        }

        .auth-link a {
            color: #003DA5;
            text-decoration: none;
            font-weight: 600;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .demo-credentials {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.05) 0%, rgba(147, 197, 253, 0.05) 100%);
            border: 1px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.85rem;
        }

        .demo-credentials strong {
            color: #1F2937;
            display: block;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .demo-item {
            padding: 6px 0;
            color: #4B5563;
            line-height: 1.6;
        }

        .demo-item strong {
            color: #1F2937;
            display: inline;
            margin: 0;
            font-size: 0.85rem;
        }

        .demo-item code {
            background: rgba(59, 130, 246, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.8rem;
            color: #1E40AF;
            font-family: 'Courier New', monospace;
            cursor: pointer;
        }

        .demo-item code:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .alert {
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .alert.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, white 100%);
            border-left: 4px solid #10B981;
            color: #065F46;
        }

        .alert-error {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, white 100%);
            border-left: 4px solid #EF4444;
            color: #991B1B;
        }

        .alert-warning {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.1) 0%, white 100%);
            border-left: 4px solid #F59E0B;
            color: #92400E;
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-login.loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: 50%;
            left: 50%;
            margin-left: -8px;
            margin-top: -8px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 15px;
            }
            .login-header {
                padding: 25px 20px 20px;
            }
            .login-header h1 {
                font-size: 1.4rem;
            }
            .login-body {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>Smart Grievance System</h1>
                <p>Secure Login Portal</p>
            </div>

            <div class="login-body">
                <div id="alertContainer"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input 
                            type="email" 
                            id="email" 
                            class="form-input" 
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                class="form-input" 
                                placeholder="Enter your password"
                                required
                                style="padding-right: 45px;">
                            <button type="button" class="toggle-password" id="togglePassword" title="Show/Hide Password">
                                👁️
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        Login
                    </button>
                </form>

                <div style="text-align: center; margin: 1rem 0;">
                    <a href="forgot-password.html" style="color: #003DA5; text-decoration: none; font-size: 14px;">
                        🔒 Forgot Password?
                    </a>
                </div>

                <div class="auth-link">
                    Don't have an account? <a href="register.html">Register here</a>
                </div>

                <div class="demo-credentials">
                    <strong>🎯 Demo Credentials (Click to auto-fill):</strong>
                    <div class="demo-item">
                        <strong>Admin:</strong> <code class="copy-email">admin@grievance.gov</code> / <code class="copy-pass">admin123</code>
                    </div>
                    <div class="demo-item">
                        <strong>Officer:</strong> <code class="copy-email">electricity@grievance.gov</code> / <code class="copy-pass">officer123</code>
                    </div>
                    <div class="demo-item">
                        <strong>Citizen:</strong> <code class="copy-email">citizen@example.com</code> / <code class="copy-pass">citizen123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Demo user credentials database
        const DEMO_USERS = [
            { email: 'admin@grievance.gov', password: 'admin123', role: 'ADMIN', name: 'Admin User' },
            { email: 'electricity@grievance.gov', password: 'officer123', role: 'OFFICER', name: 'Electricity Officer', department: 'Electricity' },
            { email: 'water@grievance.gov', password: 'officer123', role: 'OFFICER', name: 'Water Officer', department: 'Water Supply' },
            { email: 'citizen@example.com', password: 'citizen123', role: 'CITIZEN', name: 'Demo Citizen' }
        ];

        // Login attempt tracking
        const MAX_ATTEMPTS = 3;
        const LOCKOUT_DURATION = 24 * 60 * 60 * 1000; // 24 hours

        function showAlert(message, type) {
            const alertContainer = document.getElementById('alertContainer');
            const alertClass = `alert-${type}`;
            
            alertContainer.innerHTML = `<div class="alert ${alertClass} show">${message}</div>`;

            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => alertContainer.innerHTML = '', 300);
                }
            }, 5000);
        }

        function getFailedAttempts() {
            const attempts = localStorage.getItem('failedLoginAttempts');
            return attempts ? JSON.parse(attempts) : { count: 0, lockoutUntil: null };
        }

        function setFailedAttempts(count, lockoutUntil = null) {
            localStorage.setItem('failedLoginAttempts', JSON.stringify({ count, lockoutUntil }));
        }

        function resetFailedAttempts() {
            localStorage.removeItem('failedLoginAttempts');
        }

        function checkLockout() {
            const attempts = getFailedAttempts();
            if (attempts.lockoutUntil) {
                const now = new Date().getTime();
                if (now < attempts.lockoutUntil) {
                    const remainingTime = attempts.lockoutUntil - now;
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    return `Account locked. Please try again in ${hours}h ${minutes}m.`;
                } else {
                    resetFailedAttempts();
                    return null;
                }
            }
            return null;
        }

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        // Auto-fill demo credentials
        document.querySelectorAll('.copy-email').forEach(code => {
            code.addEventListener('click', function() {
                document.getElementById('email').value = this.textContent;
                showAlert('✅ Email copied to form', 'success');
            });
        });

        document.querySelectorAll('.copy-pass').forEach(code => {
            code.addEventListener('click', function() {
                document.getElementById('password').value = this.textContent;
                document.getElementById('password').setAttribute('type', 'text');
                document.getElementById('togglePassword').textContent = '🙈';
                showAlert('✅ Password copied to form', 'success');
            });
        });

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Check if account is locked
            const lockoutMessage = checkLockout();
            if (lockoutMessage) {
                showAlert('🔒 ' + lockoutMessage, 'error');
                return;
            }

            // Add loading state
            loginBtn.classList.add('loading');
            loginBtn.textContent = '';
            loginBtn.disabled = true;

            // Simulate API delay
            setTimeout(() => {
                // Find matching user
                const user = DEMO_USERS.find(u => u.email === email && u.password === password);

                if (user) {
                    // Successful login
                    resetFailedAttempts();
                    
                    // Store user session
                    localStorage.setItem('currentUser', JSON.stringify(user));
                    localStorage.setItem('isLoggedIn', 'true');

                    showAlert('✅ Login successful! Redirecting...', 'success');

                    // Redirect based on role
                    setTimeout(() => {
                        if (user.role === 'ADMIN') {
                            window.location.href = 'admin.html';
                        } else if (user.role === 'OFFICER') {
                            window.location.href = 'officer.html';
                        } else {
                            window.location.href = 'index.html';
                        }
                    }, 1500);

                } else {
                    // Failed login
                    const attempts = getFailedAttempts();
                    const newCount = attempts.count + 1;

                    if (newCount >= MAX_ATTEMPTS) {
                        // Lock the account
                        const lockoutUntil = new Date().getTime() + LOCKOUT_DURATION;
                        setFailedAttempts(newCount, lockoutUntil);
                        showAlert(`🔒 Too many failed attempts! Account locked for 24 hours.`, 'error');
                    } else {
                        setFailedAttempts(newCount);
                        const remainingAttempts = MAX_ATTEMPTS - newCount;
                        showAlert(`❌ Invalid email or password! ${remainingAttempts} attempt${remainingAttempts > 1 ? 's' : ''} remaining.`, 'error');
                    }

                    loginBtn.classList.remove('loading');
                    loginBtn.textContent = 'Login';
                    loginBtn.disabled = false;
                }
            }, 1000);
        });

        // Check lockout on page load
        window.addEventListener('DOMContentLoaded', () => {
            const lockoutMessage = checkLockout();
            if (lockoutMessage) {
                showAlert('🔒 ' + lockoutMessage, 'warning');
                document.getElementById('loginBtn').disabled = true;
            }
        });
    </script>
</body>
</html>
