    <script src="demo-system.js"></script>
    <script>
        const MAX_ATTEMPTS = 3;
        const LOCKOUT_DURATION = 24 * 60 * 60 * 1000;
        
        // Use DEMO_USERS from demo-system.js if available, otherwise use local
        const DEMO_USERS = window.DEMO_USERS || [
            { email: 'admin@grievance.gov', password: 'admin123', role: 'ADMIN', name: 'Admin User', id: 1, phone: '9999999999', canEditProfile: true, canEditUsers: true },
            { email: 'electricity@grievance.gov', password: 'officer123', role: 'OFFICER', name: 'Electricity Officer', department: 'Electricity', id: 2, phone: '9876543210', canEditProfile: true },
            { email: 'water@grievance.gov', password: 'officer123', role: 'OFFICER', name: 'Water Officer', department: 'Water Supply', id: 3, phone: '9876543211', canEditProfile: true },
            { email: 'citizen@example.com', password: 'citizen123', role: 'CITIZEN', name: 'Demo Citizen', id: 4, phone: '9123456789', canEditProfile: true }
        ];

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `<div class="alert alert-${type} show">${message}</div>`;
            setTimeout(() => {
                const alert = container.querySelector('.alert');
                if (alert) {
                    alert.classList.remove('show');
                    setTimeout(() => container.innerHTML = '', 300);
                }
            }, 5000);
        }

        function getFailedAttempts() {
            const attempts = localStorage.getItem('failedLoginAttempts');
            return attempts ? JSON.parse(attempts) : { count: 0, lockoutUntil: null };
        }

        function setFailedAttempts(count, lockoutUntil = null) {
            localStorage.setItem('failedLoginAttempts', JSON.stringify({ count, lockoutUntil }));
        }

        function resetFailedAttempts() {
            localStorage.removeItem('failedLoginAttempts');
        }

        function checkLockout() {
            const attempts = getFailedAttempts();
            if (attempts.lockoutUntil) {
                const now = new Date().getTime();
                if (now < attempts.lockoutUntil) {
                    const remainingTime = attempts.lockoutUntil - now;
                    const hours = Math.floor(remainingTime / (1000 * 60 * 60));
                    const minutes = Math.floor((remainingTime % (1000 * 60 * 60)) / (1000 * 60));
                    return `Account locked. Please try again in ${hours}h ${minutes}m.`;
                } else {
                    resetFailedAttempts();
                    return null;
                }
            }
            return null;
        }

        function fillCredentials(email, password) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = password;
        }

        document.getElementById('togglePassword').addEventListener('click', function() {
            const input = document.getElementById('password');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            this.textContent = type === 'password' ? '👁️' : '🙈';
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            const lockoutMessage = checkLockout();
            if (lockoutMessage) {
                showAlert('🔒 ' + lockoutMessage, 'error');
                return;
            }

            btn.classList.add('loading');
            btn.textContent = '';
            btn.disabled = true;

            setTimeout(() => {
                // Check demo users (case-insensitive email)
                const user = DEMO_USERS.find(u => u.email.toLowerCase() === email && u.password === password);
                
                // Check registered users
                let registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '[]');
                const registeredUser = registeredUsers.find(u => u.email.toLowerCase() === email && u.password === password);

                const finalUser = user || registeredUser;

                if (finalUser) {
                    // Success!
                    resetFailedAttempts();
                    localStorage.setItem('user', JSON.stringify(finalUser));
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('token', 'demo-token-' + Date.now());
                    
                    // Add welcome notification
                    if (window.grievanceSystem && window.grievanceSystem.addNotification) {
                        window.grievanceSystem.addNotification(finalUser.id, {
                            type: 'success',
                            message: `Welcome back, ${finalUser.name}!`
                        });
                    }
                    
                    showAlert('✅ Login successful! Redirecting...', 'success');

                    setTimeout(() => {
                        if (finalUser.role === 'ADMIN') {
                            window.location.href = 'admin.html';
                        } else if (finalUser.role === 'OFFICER') {
                            window.location.href = 'officer.html';
                        } else {
                            window.location.href = 'profile.html';
                        }
                    }, 1500);
                } else {
                    // Failed login
                    const attempts = getFailedAttempts();
                    const newCount = attempts.count + 1;

                    if (newCount >= MAX_ATTEMPTS) {
                        const lockoutUntil = new Date().getTime() + LOCKOUT_DURATION;
                        setFailedAttempts(newCount, lockoutUntil);
                        showAlert(`🔒 Too many failed attempts! Account locked for 24 hours.`, 'error');
                    } else {
                        setFailedAttempts(newCount);
                        const remainingAttempts = MAX_ATTEMPTS - newCount;
                        showAlert(`❌ Invalid email or password! ${remainingAttempts} attempt${remainingAttempts > 1 ? 's' : ''} remaining.`, 'error');
                    }

                    btn.classList.remove('loading');
                    btn.textContent = 'Login';
                    btn.disabled = false;
                }
            }, 1000);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const lockoutMessage = checkLockout();
            if (lockoutMessage) {
                showAlert('🔒 ' + lockoutMessage, 'warning');
                document.getElementById('loginBtn').disabled = true;
            }
            
            // Debug: Log demo users
            console.log('🔑 Demo Users Available:', DEMO_USERS.map(u => u.email));
        });
    </script>
</body>
</html>
