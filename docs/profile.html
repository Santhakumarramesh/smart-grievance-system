    <script src="demo-system.js"></script>
    <script>
        // Check if logged in
        if (!grievanceSystem.isLoggedIn()) {
            window.location.href = 'login.html';
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('en-IN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        function getStatusClass(status) {
            if (status === 'Resolved' || status === 'Closed') return 'status-resolved';
            if (status === 'Under Progress' || status === 'Investigation') return 'status-progress';
            return 'status-received';
        }

        function openEditModal() {
            // Redirect to dedicated edit profile page
            window.location.href = 'edit-profile.html';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function loadProfile() {
            const user = grievanceSystem.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            // Display user info
            document.getElementById('userName').textContent = user.name || 'User';
            document.getElementById('userRole').textContent = user.role || 'CITIZEN';
            document.getElementById('userEmail').textContent = user.email || 'N/A';
            document.getElementById('userPhone').textContent = user.phone || 'N/A';
            document.getElementById('displayName').textContent = user.name || 'User';
            document.getElementById('memberSince').textContent = formatDate(user.registeredAt) || 'Recently';

            // Set profile initial
            const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';
            document.getElementById('profileInitial').textContent = initial;

            // Load complaints
            const complaints = grievanceSystem.getUserGrievances();
            
            // Update statistics
            const total = complaints.length;
            const pending = complaints.filter(c => !['Resolved', 'Closed'].includes(c.status)).length;
            const resolved = complaints.filter(c => c.status === 'Resolved' || c.status === 'Closed').length;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('pendingCount').textContent = pending;
            document.getElementById('resolvedCount').textContent = resolved;

            // Display complaints
            const container = document.getElementById('complaintsContainer');
            
            if (complaints.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>No complaints filed yet</p>
                        <button onclick="window.location.href='index.html'" class="btn btn-primary" style="margin-top: 15px;">
                            File Your First Complaint
                        </button>
                    </div>
                `;
                return;
            }

            container.innerHTML = complaints.map(complaint => `
                <div class="complaint-item">
                    <div class="complaint-header">
                        <span class="complaint-id">${complaint.id}</span>
                        <span class="complaint-status ${getStatusClass(complaint.status)}">
                            ${complaint.status}
                        </span>
                    </div>
                    <div class="complaint-title">${complaint.title}</div>
                    <div class="complaint-meta">
                        ${complaint.department} • Filed on ${formatDate(complaint.createdAt)}
                    </div>
                    <button onclick="window.location.href='track.html?id=${complaint.id}'" 
                            class="btn btn-primary" 
                            style="margin-top: 10px; font-size: 12px; padding: 6px 12px;">
                        Track Status →
                    </button>
                </div>
            `).join('');

            // Load notifications
            loadNotifications();
        }

        function toggleNotifications() {
            const dropdown = document.getElementById('notificationDropdown');
            dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
            loadNotifications();
        }

        function loadNotifications() {
            const user = grievanceSystem.getUser();
            if (!user) return;

            const notifications = grievanceSystem.getNotifications(user.id);
            const container = document.getElementById('notificationList');
            
            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="padding: 30px;">
                        <div style="font-size: 48px;">📭</div>
                        <p>No notifications</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = notifications.slice(0, 10).map(n => `
                <div class="notification-item ${n.read ? '' : 'unread'}" onclick="handleNotificationClick('${n.grievanceId}', ${n.id})">
                    <div class="notification-content">
                        <div class="notification-text">${n.message}</div>
                        <div class="notification-time">${formatDate(n.timestamp)}</div>
                    </div>
                </div>
            `).join('');

            // Update badge
            const unreadCount = grievanceSystem.getUnreadCount(user.id);
            const badge = document.getElementById('notificationBadge');
            if (unreadCount > 0) {
                badge.textContent = unreadCount;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function handleNotificationClick(grievanceId, notificationId) {
            const user = grievanceSystem.getUser();
            grievanceSystem.markNotificationRead(user.id, notificationId);
            window.location.href = `track.html?id=${grievanceId}`;
        }

        function markAllRead() {
            const user = grievanceSystem.getUser();
            const notifications = grievanceSystem.getNotifications(user.id);
            notifications.forEach(n => {
                grievanceSystem.markNotificationRead(user.id, n.id);
            });
            loadNotifications();
        }

        function logout() {
            if (confirm('Are you sure you want to logout?')) {
                grievanceSystem.logout();
            }
        }

        // Load profile on page load
        window.addEventListener('DOMContentLoaded', loadProfile);

        // Update notifications every 30 seconds
        setInterval(() => {
            const user = grievanceSystem.getUser();
            if (user) {
                const unreadCount = grievanceSystem.getUnreadCount(user.id);
                const badge = document.getElementById('notificationBadge');
                if (unreadCount > 0) {
                    badge.textContent = unreadCount;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        }, 30000);

        // Close notification dropdown when clicking outside
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('notificationDropdown');
            const btn = document.getElementById('profileBtn');
            if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                dropdown.style.display = 'none';
            }
        });
    </script>
</body>
</html>
